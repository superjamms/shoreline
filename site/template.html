<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — {{site}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#13216A">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Oswald:wght@400;500&family=Montserrat:ital,wght@0,300;0,400;0,600;1,400&display=swap">

{{styles}}
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
<a class="wordmark" href="{{root}}">
<span class="wordmark-1">Shoreline</span>
<span class="wordmark-2">Open Jam</span>
</a>
<nav class="sitenav" aria-label="Pages">
{{nav}}
</nav>
</header>

<main class="sheet" id="main">

<header class="masthead">
<p class="eyebrow">{{eyebrow}}</p>
<h1>{{title}}</h1>
<p class="standfirst">{{standfirst}}</p>
</header>

{{content}}

</main>

<footer class="sitefooter">
<p><b>{{site}}</b> · 208 W. Wabash St, Michigan City, IN · Tuesdays</p>
<p class="fine">Hosted at <a href="https://www.shorelinebrewery.com/" target="_blank" rel="noopener">Shoreline Brewery</a>. This page is run by the open jam, not by the brewery. © {{year}}</p>
</footer>

</body>
</html>
